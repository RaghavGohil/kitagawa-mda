name: Kitagawa CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Test Dependencies
        # Scoring tests only need numpy + pydantic; no GPU, DB, or GDAL.
        run: |
          python -m pip install --upgrade pip
          pip install numpy pydantic pytest

      - name: Syntax Check
        run: python -m compileall -q backend inference shared

      - name: Run Unit Tests
        run: pytest inference/tests/ -v
