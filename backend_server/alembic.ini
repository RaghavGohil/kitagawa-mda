# Alembic Configuration File
# ---
# DB URL is set at runtime in env.py from shared.config.DATABASE_URL_SYNC
# Run from the backend_server directory:
#   alembic upgrade head
#   alembic revision --autogenerate -m "description"

[alembic]
script_location = alembic
prepend_sys_path = ..
# sqlalchemy.url is set programmatically in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
