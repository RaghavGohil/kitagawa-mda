services:
  # -------------------------------------------------------------------
  # Inference Server (GPU) — YOLO vessel detection
  # -------------------------------------------------------------------
  inference:
    build:
      context: .
      dockerfile: inference/Dockerfile
    container_name: kitagawa-inference
    ports:
      - "8001:8001"
    volumes:
      - ./.docker_data/transient_data:/data
      - ./inference:/app/inference
      - ./shared:/app/shared
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    environment:
      - DATA_DIR=/data
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME:-}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD:-}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Backend Server — API for frontend, data processing
  # -------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: kitagawa-backend
    ports:
      - "8000:8000"
    volumes:
      - ./.docker_data/transient_data:/data
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      inference:
        condition: service_healthy
    environment:
      - DATA_DIR=/data
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=kitagawa
      - POSTGRES_USER=kitagawa
      - POSTGRES_PASSWORD=kitagawa
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=kitagawa-chips
      - INFERENCE_SERVER_URL=http://inference:8001
      - COPERNICUS_USERNAME=${COPERNICUS_USERNAME:-}
      - COPERNICUS_PASSWORD=${COPERNICUS_PASSWORD:-}
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY:-}
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: unless-stopped

  # -------------------------------------------------------------------
  # PostgreSQL + PostGIS
  # -------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kitagawa-postgres
    ports:
      - "5432:5432"
    volumes:
      - ./.docker_data/pgdata:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=kitagawa
      - POSTGRES_USER=kitagawa
      - POSTGRES_PASSWORD=kitagawa
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U kitagawa -d kitagawa" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # -------------------------------------------------------------------
  # MinIO — Object storage for image chips
  # -------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: kitagawa-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./.docker_data/minio_data:/data
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    restart: unless-stopped

  # -------------------------------------------------------------------
  # Client — Frontend (Next.js + Leaflet)
  # -------------------------------------------------------------------
  client:
    build:
      context: ./client
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    container_name: kitagawa-client
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    restart: unless-stopped

# Volumes section removed — using bind mounts to ./ .docker_data instead
